<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Bet Tracker</title>
<style>
  :root {
    --bg: #0b0d12; --card: #151922; --line: #252b38; --text: #e8ebf2; --muted: #8b93a7;
    --win: #2fbf71; --lose: #e5484d; --push: #d6a23a; --live: #ff6b3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .updated { color: var(--muted); font-size: 13px; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bet { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
         border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .bet.covering { border-left-color: var(--win); }
  .bet.losing { border-left-color: var(--lose); }
  .bet.push { border-left-color: var(--push); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .pick { font-size: 18px; font-weight: 700; }
  .money { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
  .game { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .score { font-size: 17px; font-variant-numeric: tabular-nums; }
  .score b { font-size: 20px; }
  .clock { color: var(--muted); font-size: 13px; text-align: right; }
  .clock.live { color: var(--live); font-weight: 600; }
  .status { margin-top: 8px; font-weight: 600; }
  .status.covering { color: var(--win); } .status.losing { color: var(--lose); } .status.push { color: var(--push); }
  .status.pending { color: var(--muted); font-weight: 400; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
         border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
  .tag.planned { border-color: var(--push); color: var(--push); }
  .leg { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
  .err { color: var(--lose); font-size: 13px; margin-top: 6px; }
  details.chk { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.chk summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .chk .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chk label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .chk input { width: 92px; font-size: 16px; padding: 5px 7px; border-radius: 8px; border: 1px solid var(--line);
               background: var(--bg); color: var(--text); }
  .chk .verdict { margin-top: 8px; font-weight: 600; font-size: 14px; }
  .chk .verdict.ok { color: var(--win); } .chk .verdict.no { color: var(--lose); }
  .chk .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .calc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }
  .calc label { color: var(--muted); font-size: 13px; display: block; margin-bottom: 6px; }
  .calc input { width: 140px; font-size: 16px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--bg); color: var(--text); }
  .calc .out { margin-top: 10px; font-size: 14px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .calc .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  @media (max-width: 560px) { .totals { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Live Bet Tracker</h1>
    <span class="updated" id="updated">Loading scores…</span>
  </header>
  <div class="totals" id="totals"></div>
  <div class="calc">
    <label for="unit">Your unit size ($). Saved on this phone only, never published.</label>
    <input id="unit" type="number" inputmode="decimal" min="0" step="50" placeholder="e.g. 2000">
    <div class="out" id="calcout"></div>
    <div class="note">Season figure is the historical average of every pick the system sends (about 20 seasons). Future results may be lower.</div>
  </div>
  <div id="bets"></div>
  <footer>Scores from ESPN, refreshed every 30 seconds. Bets are added automatically when Check Bets emails them.</footer>
</div>
<script>
// Bets live in bets.json, written by Check Bets when it emails (and by Claude).
// Each: league, date YYYYMMDD, id (ESPN game), team (ESPN abbreviation), kind
// ("spread" or "under"/"over"), line, units risked, win (units won if it hits),
// book, status. A teaser has "legs" instead. Units only, never dollars: this page is public.
let BETS = [];

const PATHS = { cfb: "college-football", nfl: "nfl" };
const units = (n, signed) => (signed && n > 0 ? "+" : "") + (Math.round(n * 100) / 100) + "u";
const signed = x => (x > 0 ? "+" : "") + x;

async function scoreboard(league, date) {
  let url = `https://site.api.espn.com/apis/site/v2/sports/football/${PATHS[league]}/scoreboard?dates=${date}&limit=400`;
  if (league === "cfb") url += "&groups=80";
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`ESPN ${r.status}`);
  return (await r.json()).events || [];
}

async function loadBets() {
  const r = await fetch("bets.json", { cache: "no-store" });
  if (!r.ok) throw new Error(`bets file ${r.status}`);
  BETS = await r.json();
}

async function loadGames() {
  const keys = new Set();
  for (const b of BETS.filter(current)) for (const l of b.legs || [b]) keys.add(`${l.league}|${l.date}`);
  const games = {};
  await Promise.all([...keys].map(async k => {
    const [league, date] = k.split("|");
    for (const e of await scoreboard(league, date)) games[e.id] = e;
  }));
  return games;
}

// One leg against its game: score text, clock, and how the bet stands.
function judge(leg, e) {
  if (!e) return { state: "pending", text: "Game not found on ESPN", score: "", clock: "" };
  const c = e.competitions[0], st = c.status.type;
  const total = leg.kind === "under" || leg.kind === "over";
  const mine = total ? null : c.competitors.find(x => x.team.abbreviation === leg.team);
  const opp = c.competitors.find(x => x !== mine);
  if (!total && !mine) return { state: "pending", text: `Team ${leg.team} not in this game`, score: "", clock: "" };
  const away = c.competitors.find(x => x.homeAway === "away"), home = c.competitors.find(x => x.homeAway === "home");
  const fmt = t => t === mine ? `<b>${t.team.shortDisplayName} ${t.score}</b>` : `${t.team.shortDisplayName} ${t.score}`;
  const score = `${fmt(away)} &nbsp;@&nbsp; ${fmt(home)}`;
  const live = st.state === "in", done = st.state === "post";
  const clock = st.state === "pre" ? new Date(e.date).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })
                                   : st.shortDetail;
  if (st.state === "pre") return { state: "pending", text: "Not started", score, clock, live };
  const points = c.competitors.reduce((n, x) => n + +x.score, 0);
  const margin = !total ? (+mine.score - +opp.score) + leg.line
               : leg.kind === "under" ? leg.line - points : points - leg.line;
  const by = Math.abs(margin);
  let state = margin > 0 ? "covering" : margin < 0 ? "losing" : "push";
  let text;
  if (done) text = state === "covering" ? `WON, covered by ${by}` : state === "losing" ? `LOST by ${by}` : "PUSH";
  else text = state === "covering" ? `Covering by ${by}` : state === "losing" ? `Not covering, need ${by} more` : "Right on the number";
  return { state, text, score, clock, live, done };
}

// Only today's and upcoming bets are shown; earlier days drop off by themselves.
function today() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
}
const current = b => (b.legs || [b]).some(l => l.date >= today());

function render(games) {
  let risk = 0, won = 0, pendingRisk = 0, liveUp = 0;  // all in units
  const shown = BETS.filter(current);
  const html = shown.map(b => {
    const legs = (b.legs || [b]).map(l => ({ l, j: judge(l, games[l.id]) }));
    const planned = b.status === "planned";
    // Overall: a teaser loses if any leg loses, wins only when every leg wins.
    const states = legs.map(x => x.j.state), allDone = legs.every(x => x.j.done);
    const overall = states.includes("losing") ? "losing" : states.every(s => s === "covering") ? "covering"
                  : states.includes("pending") ? "pending" : "push";
    if (!planned) {
      risk += b.units;
      if (allDone) won += overall === "covering" ? b.win : overall === "losing" ? -b.units : 0;
      else { pendingRisk += b.units; if (overall === "covering") liveUp += b.win; if (overall === "losing") liveUp -= b.units; }
    }
    const name = l => l.kind === "under" ? `Under ${l.line}` : l.kind === "over" ? `Over ${l.line}` : `${l.team} ${signed(l.line)}`;
    const title = b.legs ? `Teaser: ${b.legs.map(name).join(" / ")}` : name(b);
    const tags = `<span class="tag">${b.book}</span>` + (planned ? `<span class="tag planned">not placed${b.note ? ": " + b.note : ""}</span>` : "");
    const body = legs.map(({ l, j }, i) => `
      <div class="${b.legs ? "leg" : ""}">
        <div class="game"><div class="score">${b.legs ? `<span class="tag" style="margin:0 6px 0 0">${name(l)}</span>` : ""}${j.score}</div>
          <div class="clock ${j.live ? "live" : ""}">${j.live ? "● " : ""}${j.clock}</div></div>
        <div class="status ${j.state}">${j.text}</div>
      </div>`).join("");
    return `<div class="bet ${overall}">
      <div class="top"><div class="pick">${title}${tags}</div>
        <div class="money">Risk ${units(b.units)}<br>To win ${units(b.win)}</div></div>
      ${body}${checkerHtml(b)}</div>`;
  }).join("");
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#bets");
  if (!typing) document.getElementById("bets").innerHTML = html ||
    "<div class='bet'><div class='status pending'>No bets placed for today yet. Send Claude your slips.</div></div>";
  lastTotals = { risk, won, live: won + liveUp };
  renderCalc();
  document.getElementById("totals").innerHTML = [
    ["Units risked", units(risk)],
    ["Settled", units(won, true)],
    ["If it ended now", units(won + liveUp, true)],
    ["Still riding", units(pendingRisk)],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}


// ---- "Still a good bet?" checker: type the line and price you see at the book ----
const typed = {};  // what's been typed, by bet key, so the 30-second refresh keeps it
function american(x) {
  const n = parseFloat(x);
  if (!isFinite(n)) return null;
  if (Math.abs(n) >= 100) return n;              // already American, e.g. -125
  if (n > 1) return n >= 2 ? (n - 1) * 100 : -100 / (n - 1);  // decimal, e.g. 1.92x
  return null;
}
const fmtLine = v => (v > 0 ? "+" : "") + v;
function fieldsFor(b) {
  const c = b.check || {}, f = [];
  const legs = b.legs || [b];
  legs.forEach((l, i) => {
    const who = b.legs ? (l.team || "Leg " + (i + 1)) + " " : "";
    if (l.kind === "under" || l.kind === "over") f.push({ id: "line" + i, label: "Total", leg: l, role: "total" });
    else {
      f.push({ id: "line" + i, label: who + "spread", leg: l, role: "spread" });
      if (c.total_max) f.push({ id: "tot" + i, label: who + "total", leg: l, role: "total" });
    }
  });
  f.push({ id: "price", label: "Price (-125 or 1.92)", role: "price" });
  return f;
}
function verdict(b) {
  const c = b.check || {}, v = typed[b.key] || {}, bad = [];
  let checked = 0;
  for (const f of fieldsFor(b)) {
    const raw = v[f.id];
    if (raw === undefined || raw === "") continue;
    const x = parseFloat(raw);
    if (!isFinite(x)) continue;
    checked++;
    if (f.role === "spread") {
      if (c.line_min !== undefined && x < c.line_min) bad.push(`${f.label} ${fmtLine(x)} is below ${fmtLine(c.line_min)}`);
      if (c.line_max !== undefined && x > c.line_max) bad.push(`${f.label} ${fmtLine(x)} is past ${fmtLine(c.line_max)}`);
    } else if (f.role === "total") {
      if (c.total_max !== undefined && x > c.total_max) bad.push(`total ${x} is over ${c.total_max}`);
    } else if (f.role === "price") {
      const a = american(raw);
      if (a === null) bad.push("price not understood");
      else if (c.worst !== undefined && a < c.worst) bad.push(`price ${a > 0 ? "+" : ""}${Math.round(a)} is worse than ${c.worst}`);
    }
  }
  if (!checked) return { cls: "", text: "" };
  return bad.length ? { cls: "no", text: "Skip: " + bad.join("; ") }
                    : { cls: "ok", text: "Still a good bet" + (checked < fieldsFor(b).length ? " (on what you entered)" : "") };
}
function checkerHtml(b) {
  if (!b.check) return "";
  const v = typed[b.key] || {}, d = verdict(b), c = b.check;
  const inputs = fieldsFor(b).map(f => `<label>${f.label}<input data-key="${b.key}" data-f="${f.id}"
      inputmode="decimal" value="${v[f.id] ?? ""}"></label>`).join("");
  const lo = c.line_min, hi = c.line_max;
  const spreadRule = lo !== undefined && hi !== undefined ? `spread ${fmtLine(lo)} to ${fmtLine(hi)}`
                   : lo !== undefined ? `spread ${fmtLine(lo)} or more`
                   : hi !== undefined ? `spread ${fmtLine(hi)} or bigger favorite` : "";
  const rule = [spreadRule,
                c.total_max !== undefined ? `total ${c.total_max} or less` : "",
                c.worst !== undefined ? `price ${c.worst} or better` : ""].filter(Boolean).join(", ");
  return `<details class="chk"${v.open ? " open" : ""} data-key="${b.key}"><summary>Still a good bet? Check the line</summary>
    <div class="hint">Needs: ${rule}.${c.note ? " " + c.note + "." : ""}</div>
    <div class="row">${inputs}</div><div class="verdict ${d.cls}" data-v="${b.key}">${d.text}</div></details>`;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.key) return;
  (typed[el.dataset.key] ||= {})[el.dataset.f] = el.value;
  const b = BETS.find(x => x.key === el.dataset.key), out = document.querySelector(`[data-v="${el.dataset.key}"]`);
  if (b && out) { const d = verdict(b); out.className = "verdict " + d.cls; out.textContent = d.text; }
});
document.addEventListener("toggle", e => {
  const el = e.target;
  if (el.classList && el.classList.contains("chk")) (typed[el.dataset.key] ||= {}).open = el.open;
}, true);

// ---- private unit calculator: the dollar amount lives only in this browser ----
const SEASON_UNITS = 20.2, SEASON_BETS = 109;  // historical average per season (picks.season_history)
let lastTotals = { risk: 0, won: 0, live: 0 };
function unitSize() {
  try { return parseFloat(localStorage.getItem("unitSize")) || 0; } catch (e) { return 0; }
}
function dollars(n) { return (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString(); }
function renderCalc() {
  const u = unitSize(), out = document.getElementById("calcout");
  if (!u) { out.innerHTML = "Enter your unit to see dollars."; return; }
  const t = lastTotals;
  out.innerHTML = `Historical season average: <b>${dollars(SEASON_UNITS * u)}</b> on about ${SEASON_BETS} bets<br>`
    + `Today's bets risk: <b>${dollars(t.risk * u)}</b><br>`
    + `Settled today: <b>${dollars(t.won * u)}</b> | If it ended now: <b>${dollars(t.live * u)}</b>`;
}
document.addEventListener("DOMContentLoaded", () => {
  const box = document.getElementById("unit");
  const u = unitSize(); if (u) box.value = u;
  box.addEventListener("input", () => {
    try { localStorage.setItem("unitSize", box.value); } catch (e) {}
    renderCalc();
  });
  renderCalc();
});

async function tick() {
  const el = document.getElementById("updated");
  try {
    await loadBets();
    render(await loadGames());
    el.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    el.textContent = "Couldn't reach ESPN (" + err.message + "). Retrying…";
  }
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
